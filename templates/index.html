<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08080a">
  <title>Local Media</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e11d48'/%3E%3Cpath d='M13 10.5v11l9-5.5z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css"
        integrity="sha384-FDFJN4eDoTbFzL8KHLAOmtAicPaFc44D0JrdAwgO91ZDgGmAHrcpMWLCwTxBSVI7" crossorigin="anonymous">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="/static/css/app.css?v=8">
</head>
<body class="min-h-dvh">
  <a href="#grid" class="skip-link">Bỏ qua tới danh sách phim</a>
  <div class="ambient" aria-hidden="true"></div>

  <header class="site-header">
    <div class="mx-auto flex max-w-[1560px] flex-wrap items-center gap-3 px-4 py-3 sm:px-6 lg:flex-nowrap lg:gap-5">
      <a href="/" class="brand group" aria-label="Local Media — trang chủ">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <rect x="2.5" y="4.5" width="19" height="15" rx="2.5"></rect>
            <path d="M7 4.5v15M17 4.5v15M2.5 9.5h4.5M2.5 14.5h4.5M17 9.5h4.5M17 14.5h4.5"></path>
          </svg>
        </span>
        <span class="brand-text">Local<span class="brand-dot">.</span>Media</span>
      </a>

      <div class="search-field order-last w-full lg:order-none lg:ml-auto lg:w-[26rem]">
        <label class="sr-only" for="search">Tìm phim</label>
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-3.5-3.5"></path>
        </svg>
        <input id="search" class="search-input" type="search" placeholder="Tìm phim, không cần gõ dấu…" autocomplete="off" maxlength="100" enterkeyhint="search">
        <button id="search-clear" class="search-clear" type="button" aria-label="Xoá nội dung tìm kiếm" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18"></path>
          </svg>
        </button>
      </div>

      <button id="scan-btn" class="btn btn-ghost shrink-0" type="button">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 11a8 8 0 1 0-2.3 6.3"></path>
          <path d="M20 5v6h-6"></path>
        </svg>
        <span>Quét ổ cứng</span>
      </button>
    </div>
  </header>

  <main id="main" class="mx-auto max-w-[1560px] space-y-10 px-4 pb-24 pt-6 sm:px-6">
    <p id="status" role="status" aria-live="polite" class="status"></p>

    <section id="continue-section" class="rail-section hidden" aria-labelledby="continue-title">
      <div class="section-head">
        <h2 id="continue-title" class="section-title">Xem tiếp</h2>
        <span class="section-hint">Đã lưu vị trí của bạn</span>
      </div>
      <div id="continue-row" class="rail" role="list"></div>
    </section>

    <section aria-labelledby="all-title">
      <div class="section-head">
        <h2 id="all-title" class="section-title">Tất cả phim</h2>
        <span id="count" class="section-hint"></span>
      </div>

      <div id="grid" class="grid grid-cols-2 gap-3 sm:grid-cols-3 sm:gap-4 lg:grid-cols-4 xl:grid-cols-5"></div>

      <div id="empty-state" class="empty-state hidden">
        <span class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <rect x="2.5" y="4.5" width="19" height="15" rx="2.5"></rect>
            <path d="M7 4.5v15M17 4.5v15M2.5 9.5h4.5M2.5 14.5h4.5M17 9.5h4.5M17 14.5h4.5"></path>
          </svg>
        </span>
        <h3 id="empty-title" class="empty-title">Chưa có phim nào</h3>
        <p id="empty-text" class="empty-text">Bỏ file phim vào thư mục <code>media/</code> (hoặc đặt <code>MEDIA_DIRS</code>), rồi bấm “Quét ổ cứng”.</p>
      </div>

      <div class="mt-8 flex justify-center">
        <button id="more-btn" class="btn btn-ghost hidden" type="button">Tải thêm</button>
      </div>
    </section>
  </main>

  <div id="player-modal" class="player-modal hidden" role="dialog" aria-modal="true" aria-labelledby="player-title" tabindex="-1">
    <div class="player-bar">
      <div class="min-w-0">
        <h2 id="player-title" class="player-title truncate"></h2>
        <p id="player-sub" class="player-sub truncate"></p>
      </div>
      <!-- Số giây tua phải khớp giá trị seekTime trong static/js/app.js -->
      <p class="player-keys" aria-hidden="true">
        <span><kbd class="kbd">Space</kbd> phát/dừng</span>
        <span><kbd class="kbd">←</kbd><kbd class="kbd">→</kbd> tua 10s</span>
        <span><kbd class="kbd">↑</kbd><kbd class="kbd">↓</kbd> âm lượng</span>
        <span><kbd class="kbd">M</kbd> tắt tiếng</span>
        <span><kbd class="kbd">C</kbd> phụ đề</span>
      </p>
      <button id="rotate-btn" class="rotate-btn" type="button" aria-label="Xoay video" title="Xoay video">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-3-6.7"></path>
          <path d="M21 3v6h-6"></path>
        </svg>
      </button>
      <button id="close-btn" class="btn btn-ghost shrink-0" type="button">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"></path>
        </svg>
        <span>Đóng</span>
        <kbd class="kbd">Esc</kbd>
      </button>
    </div>
    <div class="player-stage" id="player-stage">
      <div class="player-frame" id="player-frame">
        <video id="player" playsinline controls preload="metadata"></video>
      </div>
    </div>
  </div>

  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"
          integrity="sha384-5sFtjkYC6dakcOUFuxVZ++Jv0U/CI+tM55PY+p/wi9vBpjvgY8/FTbDb5DRFMdqb" crossorigin="anonymous"></script>
  <script src="/static/js/app.js?v=8"></script>
</body>
</html>
